name: Build MenuMeters

# Builds an unsigned (ad-hoc signed) universal MenuMeters.app and uploads it as
# a downloadable artifact. Pushing a tag like v2.1.7 also attaches the zip to a
# GitHub Release.
#
# No secrets, no certificates, no Apple Developer account required.

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Read-only by default. Only the release job below raises this to write, and it
# does nothing but attach an already-built zip to a release -- it never runs
# xcodebuild or any third-party action against the source. That way a compromised
# action in the normal build path has no token it can write to the repo with.
permissions:
  contents: read

# Every action below is pinned to a full commit SHA rather than a tag. A tag such
# as @v4 is a mutable pointer: the owner, or whoever takes over that account, can
# repoint it at new code and your next build silently runs it. That is how
# tj-actions/changed-files was compromised in March 2025 (CVE-2025-30066). A SHA
# is content-addressed and cannot be repointed. The trailing comment is the
# human-readable version; Dependabot updates both together.

jobs:
  privacy-guard:
    name: Check nothing phones home
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262          # v4

      # This build is meant to talk to exactly one host: the URL the user types
      # into Settings > Reporting. Fail loudly if an updater, an analytics SDK or
      # a hardcoded endpoint ever creeps back in.
      - name: Fail on reintroduced phone-home code
        run: |
          set -euo pipefail
          status=0

          if grep -rIn --include='*.m' --include='*.h' --include='*.plist' \
               --include='*.pbxproj' --include='*.xib' \
               -e 'Sparkle' -e 'SUUpdater' -e 'SUFeedURL' -e 'SUSendProfileInfo' . ; then
            echo "::error::Sparkle / auto-updater references found."
            status=1
          fi

          # Any http(s) literal in compiled sources is suspect. Comments and
          # documentation are fine, so only flag lines that build a URL.
          if grep -rIn --include='*.m' -E 'URLWithString:@"https?://' . ; then
            echo "::error::Hardcoded remote URL found in source."
            status=1
          fi

          # Match how a telemetry SDK actually gets used -- an import or a linked
          # framework -- not the bare word. The UI text in this app contains the
          # sentence "no update checks, no analytics", and a naive word search
          # flags the very promise it is supposed to be verifying.
          TELEMETRY='Firebase|Crashlytics|Sentry|AppCenter|GoogleAnalytics|Amplitude|Mixpanel|Segment|Bugsnag|Instabug'

          if grep -rInE "#[[:space:]]*(import|include)[[:space:]]*[<\"][^>\"]*($TELEMETRY)" \
               --include='*.m' --include='*.h' . ; then
            echo "::error::Telemetry SDK import found."
            status=1
          fi

          if grep -rInE "($TELEMETRY)\.(framework|xcframework)" \
               --include='*.pbxproj' . ; then
            echo "::error::Telemetry framework linked in the Xcode project."
            status=1
          fi

          if [ "$status" -eq 0 ]; then
            echo "Clean: no updater, no telemetry, no hardcoded endpoints."
          fi
          exit "$status"

  build:
    name: Build app
    runs-on: macos-14
    needs: privacy-guard
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262          # v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          sw_vers

      - name: Build (Release, universal, ad-hoc signed)
        run: |
          set -euo pipefail
          xcodebuild \
            -project MenuMeters.xcodeproj \
            -scheme MenuMeters \
            -configuration Release \
            -derivedDataPath build \
            ARCHS="x86_64 arm64" \
            ONLY_ACTIVE_ARCH=NO \
            MACOSX_DEPLOYMENT_TARGET=10.13 \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            ENABLE_HARDENED_RUNTIME=NO \
            build

      - name: Verify the built app
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release/MenuMeters.app"
          test -d "$APP" || { echo "App not found at $APP"; exit 1; }

          echo "--- architectures ---"
          lipo -info "$APP/Contents/MacOS/MenuMeters"

          echo "--- signature ---"
          codesign -dv "$APP" 2>&1 || true

          echo "--- linked frameworks ---"
          otool -L "$APP/Contents/MacOS/MenuMeters" | sed 's/^/  /'

          # Nothing should be embedded in Frameworks/ any more; Sparkle was the
          # only thing that ever lived there.
          if [ -d "$APP/Contents/Frameworks" ]; then
            echo "::warning::Unexpected embedded frameworks:"
            ls -la "$APP/Contents/Frameworks"
          fi

      - name: Package
        run: |
          set -euo pipefail
          mkdir -p dist
          # ditto, not zip: it preserves the bundle's symlinks and resource forks.
          ditto -c -k --keepParent \
            "build/Build/Products/Release/MenuMeters.app" \
            "dist/MenuMeters.zip"
          ls -lh dist

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: MenuMeters-app
          path: dist/MenuMeters.zip
          if-no-files-found: error

  # Separate job purely so `contents: write` is scoped to it. It is the only
  # place in this workflow with a token that can write to the repo, it runs no
  # build and no code from the source tree, and it only fires for a v* tag.
  release:
    name: Attach to release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download the built app
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: MenuMeters-app
          path: dist

      - name: Attach to release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2
        with:
          files: dist/MenuMeters.zip
          body: |
            Unsigned build of MenuMeters with all phone-home removed and
            user-configured metrics reporting added.

            macOS will refuse to open it until you clear the download quarantine:

                xattr -dr com.apple.quarantine /Applications/MenuMeters.app
